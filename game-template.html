/* A recessed portrait field, raised artwork and one neutral finish for every card. */
:root{--gold:#c7ded8;--mint:#9ee5d6;--bg:#11171b;--ink:#f7f6f1;--muted:#a9b4b6;--line:#354146}

.card[data-edition="sapphire"]{--edition-light:#864253;--edition-dark:#311322;--edition-edge:#c88494}
.card[data-edition="cobalt"]{--edition-light:#48578d;--edition-dark:#191c49;--edition-edge:#9199c5}
.card[data-edition="emerald"]{--edition-light:#467969;--edition-dark:#142f2a;--edition-edge:#85b4a4}
.card[data-edition="gold"]{--edition-light:#8c7348;--edition-dark:#3b2d1e;--edition-edge:#d4b482}
.card[data-edition="black"]{--edition-light:#444751;--edition-dark:#111217;--edition-edge:#a6a3ad}
.edition-detail{color:#ffe0a1;font-weight:800}

.card .cardbody{position:relative;color:var(--card-caption-ink,#1d292b)}
.card .cardbody .stats,.card .cardbody .skill{color:inherit}
.card .cardbody:has(.front-serial) .stats,.card .cardbody:has(.front-serial) .skill{padding-right:4.6em}
.card .cardbody .front-serial{position:absolute;right:6%;bottom:6%;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(9px,1.5vw,20px);color:#704811;font-weight:950;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 1px #fff5c6,0 0 5px #ffe099;pointer-events:none}
.card[data-caption-tone="dark"]{--card-caption-ink:#fff}
.physical-back .back-description{color:#fff;letter-spacing:normal;font-size:11px;line-height:1.35;padding-inline:8px}
.deck-card-view{min-width:0;position:relative;perspective:700px}
.deck-card-rotor{position:relative;transform-style:preserve-3d}
.deck-card-rotor > .card{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.deck-card-rotor > .physical-back{gap:4px;font-size:12px}
.deck-card-rotor .back-serial{font-size:clamp(15px,2vw,28px)}
.deck-card-rotor .brand-seal{margin:auto;width:24px;height:24px;font-size:16px}
@media(hover:hover) and (pointer:fine){
 [data-pc-card]{cursor:grab;user-select:none}
 [data-pc-card].dragging{cursor:grabbing}
 .home-card-motion.held{animation:none}
}

.card .meta{display:flex;justify-content:flex-end}
.card .meta span{padding:3px 5px;background:#142128ee;color:white}
.card .cardbody .front-serial{font-size:clamp(11px,1.55vw,21px);right:5%;bottom:7%;color:#65410d;text-shadow:0 1px #fff5c6,0 0 6px #ffd268}
.card .cardbody:has(.front-serial) .skill{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[data-edition] .art-field{box-shadow:inset 0 0 14px color-mix(in srgb,var(--edition-edge) 42%,transparent)}
.card:not(.unowned):after{z-index:3;animation:card-gloss 5s ease-in-out infinite;animation-delay:calc(var(--i,0) * -125ms)}
@keyframes card-gloss{0%{transform:translateX(-110%)} 17%,100%{transform:translateX(110%)}}
@media(prefers-reduced-motion:reduce){.card:not(.unowned):after{animation:none}}
.unit[data-edition="sapphire"]{--edition-unit:#c88494}
.unit[data-edition="cobalt"]{--edition-unit:#9199c5}
.unit[data-edition="emerald"]{--edition-unit:#85b4a4}
.unit[data-edition="gold"]{--edition-unit:#d4b482}
.unit[data-edition="black"]{--edition-unit:#a6a3ad}
.unit[data-edition]{border-color:var(--edition-unit);background:radial-gradient(ellipse at top,color-mix(in srgb,var(--edition-unit) 48%,#13212a),#13212a)}
.unit{position:relative}
.unit{position:relative}
.unit .unit-serial{position:absolute;top:3px;right:4px;background:#152028e8;border-radius:3px;padding:1px 4px;color:#ffe09c;font-size:10px;text-shadow:0 0 5px #df9f57}
@media(max-width:680px){
 .deck-tray{position:relative;padding:9px}
 .deck-tray .toolbar{flex-wrap:wrap}
 .deck-tray #deckcount{flex:1 0 100%}
 .deck-tray #deck-slots{grid-template-columns:repeat(3,minmax(0,1fr))}
 #collection-grid .grid,.copy-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .deck-card-cell .btn,.copy-tile .btn{min-height:44px;white-space:normal}
 .deck-tray .btn,.lane-title,#commit{min-height:44px}
 .arena-shell .hand{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 .arena-shell .hand .card{aspect-ratio:.78}
 .arena-shell .lane{min-width:0}
 .home-fighter{grid-template-columns:minmax(0,1fr);text-align:center;padding:14px}
 .home-art{max-width:190px;margin:auto}
 .home-showcase{grid-template-columns:minmax(0,1fr)}
 .home-showcase aside{display:flex;justify-content:center;gap:5px}
 .home-tabs{grid-template-columns:repeat(auto-fit,minmax(85px,1fr))}
}

<script>
const cards = /* CARD_DATA */;
const tiers=['일반','희귀','전설'];
let featuredId=null, featuredCopy=null;
try{const featured=JSON.parse(localStorage.getItem('lilago-featured-card'));featuredId=featured?.card??featured;featuredCopy=featured?.copy??null;}catch{}
const zones=['왼쪽','가운데','오른쪽'];
const starter=[6,11,25,30,41,48];
const saveKey='lilago-card-arena-v1';
function load(){
  const fresh={coins:600,owned:starter,deck:starter,wins:0,stats:{}};
  try {
    const data=JSON.parse(localStorage.getItem(saveKey));
    if(!data)return fresh;
    const owned=[...new Set([...starter,...data.owned.filter(id=>cards[id])])];
    const deck=[...new Set(data.deck.filter(id=>Number.isInteger(id)&&cards[id]))];
    return {coins:Number.isSafeInteger(data.coins)&&data.coins>=0?data.coins:600,owned,deck:deck.length===6?deck:starter,wins:Number.isSafeInteger(data.wins)?data.wins:0,stats:data.stats||{},copies:data.copies||{},collectionCopies:data.collectionCopies,deckCopies:data.deckCopies||{}};
  }catch{return fresh;}
}
let profile=load(), match=null, tab='battle', draft=[...profile.deck], query='', packResults=[], opening=false;
const main=document.querySelector('#main'), detail=document.querySelector('#detail');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function save(){try{localStorage.setItem(saveKey,JSON.stringify(profile));return true;}catch{return false;}}

const mouseCardRotation=matchMedia('(hover:hover) and (pointer:fine)');
function bindMouseCardRotation(stage){
  if(!stage)return;
  const rotor=stage.firstElementChild;
  let drag=null,suppressClick=false;
  stage.addEventListener('pointerdown',event=>{
    if(!mouseCardRotation.matches||event.pointerType!=='mouse'||event.button!==0||drag||!rotor.contains(event.target))return;
    const transform=getComputedStyle(rotor).transform;
    drag={id:event.pointerId,startX:event.clientX,startY:event.clientY,transform,moved:false};
    rotor.style.transform=transform;
    rotor.classList.add('held');
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    const dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;
    if(!drag.moved&&Math.hypot(dx,dy)<4)return;
    if(!drag.moved)stage.setPointerCapture(event.pointerId);
    drag.moved=true;
    const base=drag.transform==='none'?'':drag.transform;
    rotor.style.transform=`rotateX(${-dy*.65}deg) rotateY(${dx*.85}deg) ${base}`;
  });
  function release(event){
    if(drag?.id!==event.pointerId)return;
    suppressClick=drag.moved;
    drag=null;
    stage.classList.remove('dragging');
    rotor.style.removeProperty('transform');
    rotor.classList.remove('held');
    setTimeout(()=>{suppressClick=false;},0);
  }
  stage.addEventListener('pointerup',release);
  stage.addEventListener('pointerleave',event=>{if(drag&&!drag.moved)release(event);});
  stage.addEventListener('pointercancel',release);
  stage.addEventListener('click',event=>{
    if(suppressClick){event.preventDefault();event.stopPropagation();}
  },true);
}

function playSound(kind){

    audio??=new AudioContext();

    const tones={open:[82,146,220],reveal:[330,440,660],strike:[140,60],win:[262,330,392,523],deploy:[196,294]}[kind];

}

function hurt(u,amount,pierce=false){

    case 'rally':triggered=allies.length>1;allies.filter(v=>v!==u).forEach(v=>v.atk+=n);break;
    case 'ambush':triggered=!!target;if(target)hurt(target,n);break;
    case 'pull':triggered=!!(target||nearby);if(!target&&nearby)nearby.lane=lane;if(target||nearby)hurt(target||nearby,n);break;

function attack(u,hits,drains){
  const {lane,side,c}=u,{fx,n}=c, other=1-side;
  const enemies=line(other,lane), target=enemies[0];
  const add=(v,amount,pierce=false)=>{if(v&&amount>0)hits.push({v,amount,pierce});};
  if(!target){
    if(fx==='empty'){const target=adjacent(lane).map(j=>front(other,j)).find(Boolean);if(target){add(target,n);recordSkill(u);}}
    return;
  }
  let amount=Math.max(0,u.atk-u.weak);
  u.attacks++;
  const bonuses={
    finisher:target.hp*2<=target.c.hp,laststand:u.hp*2<=c.hp,bond:line(side,lane).length>1,
    heavies:target.c.hp>=90,flank:lane!==1,solo:line(side,lane).length===1,
    echo:match.turn>=3,combo:u.attacks%2===0,beat:match.turn%2===1
  };
  if(bonuses[fx]){amount+=n;recordSkill(u);}
  if(target.c.fx==='armor'&&amount){amount=Math.max(0,amount-target.c.n);recordSkill(target);}
  add(target,amount);
  if(fx==='splash')adjacent(lane).forEach(j=>{const target=front(other,j);if(target){add(target,n);recordSkill(u);}});
  if(fx==='cleave'&&enemies[1]){add(enemies[1],n);recordSkill(u);}

function fight(){

  for(const {v,amount,pierce} of hits){
    const d=damage.get(v)||{normal:0,pierce:0};
    d[pierce?'pierce':'normal']+=amount;damage.set(v,d);
  }
  const recovering=drains.map(({u,target,amount,n})=>[u,Math.max(0,Math.min(n,amount-target.shield-((target.c.fx==='veil'&&!target.used)?target.c.n:0),target.hp))]);

    let {normal,pierce}=d;
    if(unit.c.fx==='veil'&&!unit.used){
      recordSkill(unit);
      const blocked=Math.min(normal,unit.c.n);
      normal-=blocked;
      pierce=Math.max(0,pierce-(unit.c.n-blocked));
      unit.used=true;
    }
    const absorbed=Math.min(unit.shield,normal);
    unit.shield-=absorbed;
    hurt(unit,normal-absorbed+pierce,true);
  }
  recovering.forEach(([u,n])=>{if(n&&u.hp>0&&u.hp<u.c.hp){heal(u,n);recordSkill(u);}});

    for(const burn of u.burn){hurt(u,burn.n);burn.left--;}
    u.burn=u.burn.filter(b=>b.left>0);
    if(u.hp>0&&u.hp<u.c.hp&&u.c.fx==='snack'){heal(u,u.c.n);recordSkill(u);}
    if(u.hp>0&&u.c.fx==='growth'){u.atk+=u.c.n;recordSkill(u);}

function enemyPlay(){
  const options=match.hands[1].flatMap(id=>zones.map((_,lane)=>{
    const c=cards[id], a=score(0,lane), b=score(1,lane);
    const contest=a-b;
    const spread=b===0?27:0;
    const pressure=contest>0&&contest<140?24:0;
    const positional=(c.fx==='flank'&&lane!==1?16:0)+(c.fx==='bond'&&b>0?14:0)+(c.fx==='solo'&&b===0?13:0)+(c.fx==='ambush'&&a>0?18:0);
    return {id,lane,value:Math.random()*61+spread+pressure+positional+Math.min(12,contest/8)+c.atk/2+c.hp/10};
  }));
  return options.sort((a,b)=>b.value-a.value)[0];

  if(!m||m.busy||m.outcome||m.selected===null||m.lane===null)return;
  const enemy=enemyPlay();
  const players=[makeUnit(m.selected,0,m.lane),makeUnit(enemy.id,1,enemy.lane)];
  m.teams.flat().forEach(u=>{u.weak=0;u.locked=false;});
  players.forEach(u=>{
    m.teams[u.side].push(u);
    m.hands[u.side]=m.hands[u.side].filter(id=>id!==u.c.id);
  });
  m.history.unshift(`${m.turn}턴 · 내 ${players[0].c.name} (${zones[m.lane]}) / 상대 ${players[1].c.name} (${zones[enemy.lane]})`);
  m.used??=[];m.used.push(m.selected);
  m.busy=true;m.phase='deployment';m.fresh=players;announceBattle(m,m.turn+'턴 카드 배치');playSound('deploy');
  setTimeout(()=>{
    if(match!==m)return;
    const original=m.teams.map((team,side)=>zones.map((_,i)=>line(side,i).map(u=>({...u,original:u}))));
    m.announcement='';m.casts=[];
    const priority=m.turn%2===1?players:[...players].reverse();
    priority.forEach(deploy);
    fight();
    m.snapshot=original;
    m.changes=zones.map((_,i)=>original.flatMap(lanes=>lanes[i]).flatMap(u=>{
      const diff=u.original.hp-u.hp, shield=u.original.shield-u.shield;
      if(diff!==0)return [{side:u.side,label:diff>0?'+'+diff:String(diff)}];
      if(shield!==0)return [{side:u.side,label:(shield>0?'+':'')+shield+' 방어'}];
      if(u.lane!==u.original.lane)return [{side:u.side,label:'이동'}];
      return [];
    }).slice(0,6));
    playCasts(m,()=>{
    m.phase='impact';m.fresh=[];m.announcement='';
    if(tab==='battle'){render();if(m.changes.some(lane=>lane.length))playSound('strike');}
    setTimeout(()=>{
      if(match!==m)return;
      announceBattle(m,m.turn+'턴 종료');
      setTimeout(()=>{
      if(match!==m)return;
      m.busy=false;m.phase='';m.announcement='';m.selected=null;m.lane=null;m.snapshot=null;m.changes=null;
      if(m.turn===5){
        const counts=[0,0];
        zones.forEach((_,i)=>{const a=score(0,i),b=score(1,i);if(a!==b)counts[a>b?0:1]++;});
        m.outcome=counts[0]>=2?'win':counts[1]>=2?'loss':'draw';
        profile.coins+=({win:120,loss:40,draw:60})[m.outcome];
        profile.stats??={};
        for(const id of m.used){const row=profile.stats[id]??={uses:0,wins:0};row.uses++;if(m.outcome==='win')row.wins++;}
        if(m.outcome==='win'){profile.wins++;if(tab==='battle')playSound('win');}
        save();returnAfterMatch(m);
      }else{m.turn++;m.deadline=Date.now()+20000;announceBattle(m,m.turn+'턴 시작');}
      if(tab==='battle')render();else updateHeader();
      },reduced?10:660);
    },reduced?10:760);
    });
  },reduced?10:550);
}

async function onlineFetch(route,method='GET',body){
  if(!onlineBase.startsWith('http'))throw Error('온라인 서버 주소가 설정되지 않았어.');
  const headers=token?{Authorization:'Bearer '+token}:{};
  if(body)headers['Content-Type']='application/json';
  const response=await fetch(onlineBase+route,{method,headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(40000)});
  if(response.status===401&&token){
    token='';onlineProfile=null;updateHeader();
    try{localStorage.removeItem('lilago-online-token');}catch{}

  const result=await response.json();

}

function loadOnlineMatch(room){
  const previous=match?.online&&match.roomId===room.id?match:null;
  const played=previous&&room.last&&room.last.turn>previous.lastTurn;
  const reorient=team=>room.side===0?team:[team[1],team[0]];
  const teams=reorient(room.teams).map((team,side)=>team.map(u=>({...u,side,c:cards[u.c.id]})));
  const outcome=room.winner===null?null:room.winner===-1?'draw':room.winner===room.side?'win':'loss';
  const state={
    copies:reorient(room.copies??[{},{}]),online:true,ai:room.ai,roomId:room.id,opponent:room.opponent.name,teams,hands:[room.hands,[]],turn:room.turn,deadline:outcome?null:(!played&&previous?previous.deadline:Math.min(room.deadline,Date.now()+20000)),
    selected:played?null:(previous?.selected??null),lane:played?null:(previous?.lane??null),busy:room.submitted,outcome,
    history:previous?.history||[],lastTurn:room.last?.turn??0
  };
  match=state;
  const proceed=()=>{if(outcome){returnAfterMatch(state);void onlineFetch('/profile').then(syncAccount).catch(()=>{});}if(tab==='battle')render();if(!outcome)scheduleOnline(pollOnlineMatch);};
  if(played&&tab==='battle'){
    state.history.unshift(`${room.last.turn}턴 · 양쪽 카드 공개 및 공격 완료`);
    state.casts=room.last.casts.map(c=>({...c,side:c.side===room.side?0:1}));
    state.busy=true;state.outcome=null;
    state.phase='deployment';
    state.fresh=teams.flat().filter(u=>!previous.teams[u.side].some(old=>old.c.id===u.c.id));
    state.announcement=room.last.turn+'턴 카드 배치';
    render();playSound('deploy');
    setTimeout(()=>{
      if(match!==state)return;
      state.announcement='';
      playCasts(state,()=>{
        announceBattle(state,room.last.turn+'턴 종료');
        setTimeout(()=>{
          if(match!==state)return;
          state.busy=room.submitted;state.phase='';state.outcome=outcome;
          if(!outcome)announceBattle(state,state.turn+'턴 시작');
          proceed();
        },reduced?10:660);
      });
    },reduced?10:500);
  }else{if(!previous&&!outcome)announceBattle(state,'대전 시작 · '+state.turn+'턴');proceed();}
}
async function pollOnlineMatch(){
  const id=match?.roomId;
  if(!id||match.outcome)return;
  const state=match;
  try{
    const room=await onlineFetch('/match?id='+encodeURIComponent(id));
    if(match!==state||state.sending)return;
    if(room.turn===state.turn&&room.submitted===state.busy&&room.winner===null){scheduleOnline(pollOnlineMatch);return;}
    loadOnlineMatch(room);
  }catch(e){if(match===state){onlineMessage=e.message;scheduleOnline(pollOnlineMatch);}}
}
async function submitOnlineMove(){
  const state=match;
  if(!state?.online||state.busy||state.outcome||state.selected===null||state.lane===null)return;
  clearTimeout(onlineTimer);state.busy=true;state.sending=true;render();
  try{
    const room=await onlineFetch('/match','POST',{id:state.roomId,turn:state.turn,card:state.selected,lane:state.lane});
    if(match===state)loadOnlineMatch(room);
  }catch(e){
    if(match===state){state.busy=false;state.sending=false;state.history.unshift(e.message);render();scheduleOnline(pollOnlineMatch);}
  }
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');
  if(!b||b.disabled)return;
  if(b.dataset.onlinePanel){onlinePanel=b.dataset.onlinePanel;onlineMessage='';renderOnline();void refreshOnline();return;}
  if(b.dataset.go==='online'||b.dataset.tab==='online'){void refreshOnline();return;}
  const action=b.dataset.onlineAction;
  if(!action||onlineBusy)return;
  if(action==='refresh'){void refreshOnline();return;}
  onlineBusy=true;onlineMessage='';
  try{
    if(action==='buy'||action==='unlist'){
      const price=Number(b.dataset.price);
      if(action==='buy'&&!confirm(price.toLocaleString()+' 코인으로 이 카드를 구매할까?'))return;
      const value=await onlineFetch('/market/'+(action==='buy'?'buy':'cancel'),'POST',{id:b.dataset.item,price});
      syncAccount(value.player);marketItems=value.market;
    }else if(action==='cancel'){queued=false;clearTimeout(onlineTimer);await onlineFetch('/queue','DELETE');}
    else{
      const status=await onlineFetch('/queue','POST',{});
      if(status.room){queued=false;tab='battle';loadOnlineMatch(status.room);return;}
      queued=status.queued;queuedAt=Date.now();
      if(queued)scheduleOnline(pollQueue);
    }
  }catch(err){onlineMessage=err.message;}
  finally{onlineBusy=false;if(tab==='online')renderOnline();else if(action==='cancel'&&tab==='matching'){tab='battle';render();}}
});

    if(kind==='register'){

async function photoData(file){
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8_000_000)throw Error('JPG, PNG, WebP 사진을 8MB 이하로 골라줘.');
  const bitmap=await createImageBitmap(file);
  const factor=Math.min(1,640/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(bitmap.width*factor);canvas.height=Math.round(bitmap.height*factor);
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close();
  return canvas.toDataURL('image/jpeg',.72);
}

let lobbyMusic=null,musicOn=true,trackIndex=0,musicVolume=.33;
try{
  const settings=JSON.parse(localStorage.getItem('lilago-music-settings')||'{}');
  if(typeof settings.on==='boolean')musicOn=settings.on;
  if(Number.isInteger(settings.track)&&lobbyTracks[settings.track])trackIndex=settings.track;
  if(Number.isFinite(settings.volume))musicVolume=Math.max(0,Math.min(1,settings.volume));
}catch{}
const failedLobbyTracks=new Set();
function skipFailedLobbyTrack(){
  if(!musicOn||match)return;
  failedLobbyTracks.add(trackIndex);
  for(let step=1;step<lobbyTracks.length;step++){
    const next=(trackIndex+step)%lobbyTracks.length;
    if(!failedLobbyTracks.has(next)){chooseTrack(next,false);return;}
  }
}
function updateLobbyMusic(){
  if(typeof Audio==='undefined'||!lobbyTracks.length)return;
  if(!lobbyMusic&&musicOn){
    lobbyMusic=new Audio(lobbyTracks[trackIndex].url);
    lobbyMusic.volume=musicVolume;
    lobbyMusic.addEventListener('ended',()=>{chooseTrack(trackIndex+1);const panel=document.querySelector('#music-settings');if(panel.open)showMusicSettings();});
    lobbyMusic.addEventListener('playing',()=>failedLobbyTracks.clear());
    lobbyMusic.addEventListener('error',skipFailedLobbyTrack);
  }
  if(!lobbyMusic)return;
  if(!musicOn||match){lobbyMusic.pause();return;}
  if(lobbyMusic.error&&!failedLobbyTracks.has(trackIndex))skipFailedLobbyTrack();
  if(lobbyMusic.paused)void lobbyMusic.play().catch(error=>{
    if(error.name==='NotSupportedError'&&lobbyMusic.error&&!failedLobbyTracks.has(trackIndex))skipFailedLobbyTrack();
  });
}
function storeMusic(){try{localStorage.setItem('lilago-music-settings',JSON.stringify({on:musicOn,track:trackIndex,volume:musicVolume}));}catch{}}
function trackTitle(i){
  return lobbyTracks[i].title;
}
function chooseTrack(index,resetFailures=true){
  if(!lobbyTracks.length)return;
  if(resetFailures)failedLobbyTracks.clear();
  trackIndex=(index+lobbyTracks.length)%lobbyTracks.length;
  if(lobbyMusic)lobbyMusic.src=lobbyTracks[trackIndex].url;
  storeMusic();updateLobbyMusic();
}
function showMusicSettings(){
  const panel=document.querySelector('#music-settings');
  panel.innerHTML=`<div class="welcome-body"><div class="toolbar"><h2>음악 설정</h2><button class="btn" id="music-close">닫기</button></div><label>음악 볼륨 <output id="music-level">${Math.round(musicVolume*100)}%</output><input id="music-volume" type="range" min="0" max="100" value="${Math.round(musicVolume*100)}"></label><label>곡 선택 <select id="music-track">${lobbyTracks.map((_,i)=>`<option value="${i}" ${i===trackIndex?'selected':''}>${escapeHTML(trackTitle(i))}</option>`).join('')}</select></label><div class="toolbar"><button class="btn" id="music-prev">이전 곡</button><button class="btn primary" id="music-play">${musicOn?'일시정지':'재생'}</button><button class="btn" id="music-next">다음 곡</button></div></div>`;
  if(!panel.open)panel.showModal();
}
